<template>
    <lightning-card title="Colour" icon-name="utility:color_swatch">
        <template if:true={colour}>
            <div class="slds-card__body slds-card__body_inner">
                <div class="swatch-fill" style={swatchStyle}>
                    <span class="swatch-label">{label}</span>
                </div>
            </div>
        </template>
        <template if:false={colour}>
            <div class="slds-card__body slds-card__body_inner slds-text-color_weak slds-text-align_center">
                No colour set
            </div>
        </template>
    </lightning-card>
</template>

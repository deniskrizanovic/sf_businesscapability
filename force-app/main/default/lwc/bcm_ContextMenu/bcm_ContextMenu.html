<template>
    <div class="bcm-menu-wrapper" style={wrapperStyle}>
        <div class="bcm-menu-arrow"></div>
        <div class="bcm-menu-card">
            <div class="bcm-menu-header">
                <span class="bcm-menu-title">{menuTitle}</span>
                <button class="bcm-menu-close" onclick={handleClose} title="Close">✕</button>
            </div>
            <ul class="bcm-menu-list" role="menu">
                <li class="bcm-menu-item" role="menuitem" onclick={handleViewDetail}>
                    <lightning-icon icon-name="utility:open" size="x-small" class="bcm-menu-icon"></lightning-icon>
                    <span>View detail</span>
                </li>
                <template if:true={canEdit}>
                    <li class="bcm-menu-item" role="menuitem" onclick={handleHide}>
                        <lightning-icon icon-name="utility:hide" size="x-small" class="bcm-menu-icon"></lightning-icon>
                        <span>Hide</span>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>

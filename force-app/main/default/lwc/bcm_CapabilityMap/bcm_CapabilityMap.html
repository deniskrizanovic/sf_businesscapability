<template>
    <div class="bcm-root">
    <!-- Toolbar -->
    <div class="bcm-toolbar slds-grid slds-grid_align-spread slds-p-around_x-small slds-border_bottom">
        <div class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
            <div class="slds-col">
                <lightning-combobox
                    label="Map"
                    placeholder="Select a map…"
                    options={mapOptions}
                    value={selectedMapId}
                    disabled={isSavingDragDrop}
                    onchange={handleMapChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col">
                <lightning-combobox
                    label="Colour by Tag"
                    placeholder="None"
                    options={tagOptions}
                    value={selectedTagId}
                    onfocus={handleTagFocus}
                    onchange={handleTagChange}>
                </lightning-combobox>
            </div>
        </div>
        <div class="slds-grid slds-grid_vertical-align-end slds-gutters_xx-small">
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:add"
                    title="Zoom In"
                    onclick={handleZoomIn}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:dash"
                    title="Zoom Out"
                    onclick={handleZoomOut}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    title="Reset View"
                    onclick={handleResetView}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:expand"
                    title="Fit to Window"
                    onclick={handleFitToWindow}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:hide"
                    title="Show Hidden"
                    variant={showHiddenVariant}
                    onclick={handleToggleHidden}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    data-id="cross-cutting-toggle"
                    icon-name="utility:rows"
                    title="Cross-cutting"
                    variant={crossCuttingVariant}
                    onclick={handleToggleCrossCutting}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    data-id="strategic-support-toggle"
                    icon-name="utility:strategy"
                    title="Strategic Support"
                    variant={strategicSupportVariant}
                    onclick={handleToggleStrategicSupport}>
                </lightning-button-icon>
            </div>
        </div>
    </div>

    <!-- Error -->
    <template if:true={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_small" role="alert">
            <span>{errorMessage}</span>
        </div>
    </template>

    <!-- Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading…" size="medium"></lightning-spinner>
    </template>

    <!-- SVG Canvas -->
    <div class="bcm-canvas-container" data-bcm-saving={savingAttr}>
        <svg
            class="bcm-canvas"
            width={canvasWidth}
            height={canvasHeight}
            tabindex="0"
            onkeydown={handleKeyDown}
            onmousedown={handleSvgMouseDown}
            onmousemove={handleSvgMouseMove}
            onmouseup={handleSvgMouseUp}
            onmouseleave={handleSvgMouseUp}
            onwheel={handleWheel}>

            <!-- L2 layer: full pan + zoom -->
            <g transform={viewportTransform}>
                <!-- L2 Boxes -->
                <template for:each={l2Nodes} for:item="node">
                    <g key={node.id} onclick={handleNodeClick} data-node-id={node.id} data-node-name={node.name} data-node-level="2" data-focused={node.isFocused} class="bcm-node bcm-l2">
                        <rect
                            x={node.x}
                            y={node.y}
                            width={node.width}
                            height={node.height}
                            rx="6"
                            fill={node.fill}
                            stroke={node.strokeColour}
                            stroke-width={node.strokeWidth}
                            stroke-dasharray={node.strokeDash}>
                        </rect>
                        <template if:true={node.strategyMark}>
                            <template if:true={node.strategyMark.isRect}>
                                <rect class="bcm-strategy-stripe"
                                      x={node.strategyMark.x}
                                      y={node.strategyMark.y}
                                      width={node.strategyMark.width}
                                      height={node.strategyMark.height}>
                                </rect>
                            </template>
                        </template>
                        <template if:true={canEdit}>
                            <text
                                class="bcm-drag-handle"
                                data-bcm-drag-handle="true"
                                data-node-id={node.id}
                                data-node-level="2"
                                x={node.handleX}
                                y={node.handleY}
                                font-size="14"
                                fill={dragHandleColour}
                                onmousedown={handleHandleMouseDown}>
                                ⠿
                            </text>
                        </template>
                        <template for:each={node.labelLines} for:item="line">
                            <text
                                key={line.key}
                                x={line.x}
                                y={line.y}
                                dominant-baseline="middle"
                                fill={l2LabelColour}
                                font-size="12"
                                font-weight="bold">
                                {line.text}
                            </text>
                        </template>
                        <!-- L3 bullets -->
                        <template for:each={node.bulletGroups} for:item="group">
                            <g key={group.key} class="bcm-l3-group" data-l3-group={group.l3Id} style="cursor:pointer">
                                <template if:true={group.focusRect}>
                                    <rect
                                        x={group.focusRect.x}
                                        y={group.focusRect.y}
                                        width={group.focusRect.width}
                                        height={group.focusRect.height}
                                        rx="3"
                                        fill="transparent"
                                        stroke={focusRingColour}
                                        stroke-width="1"
                                        class="bcm-l3-focus-rect">
                                    </rect>
                                </template>
                                <template if:true={group.tagRect}>
                                    <rect
                                        x={group.tagRect.x}
                                        y={group.tagRect.y}
                                        width={group.tagRect.width}
                                        height={group.tagRect.height}
                                        rx="3"
                                        fill={group.tagRect.fill}
                                        class="bcm-l3-tag-rect">
                                    </rect>
                                </template>
                                <template if:true={group.strategyMark}>
                                    <template if:true={group.strategyMark.isRect}>
                                        <rect class="bcm-strategy-stripe"
                                              x={group.strategyMark.x}
                                              y={group.strategyMark.y}
                                              width={group.strategyMark.width}
                                              height={group.strategyMark.height}>
                                        </rect>
                                    </template>
                                </template>
                                <template for:each={group.lines} for:item="line" for:index="lineIdx">
                                    <text
                                        key={line.key}
                                        data-node-id={group.l3Id}
                                        data-node-name={group.l3Name}
                                        data-node-level="3"
                                        data-focused={group.isFocused}
                                        x={line.x}
                                        y={line.y}
                                        dominant-baseline="middle"
                                        fill={line.fill}
                                        font-size="11"
                                        font-weight={line.fontWeight}
                                        font-style={line.fontStyle}>
                                        {line.text}
                                    </text>
                                </template>
                                <template if:true={canEdit}>
                                    <rect
                                        class="bcm-l3-drag-handle"
                                        data-bcm-drag-handle="true"
                                        data-node-id={group.l3Id}
                                        data-node-level="3"
                                        x={group.handleHitX}
                                        y={group.handleHitY}
                                        width={group.handleHitW}
                                        height={group.handleHitH}
                                        fill="transparent"
                                        onmousedown={handleHandleMouseDown}>
                                    </rect>
                                </template>
                            </g>
                        </template>
                    </g>
                </template>
            </g>

            <!-- L1 layer: pans horizontally only, not vertically — drawn last so always on top -->
            <g transform={l1Transform}>
                <template for:each={l1Nodes} for:item="node">
                    <g key={node.id} onclick={handleNodeClick} data-node-id={node.id} data-node-name={node.name} data-node-level="1" data-focused={node.isFocused} class="bcm-node bcm-l1">
                        <polygon points={node.points} fill={node.fill} stroke={node.strokeColour} stroke-width={node.strokeWidth} stroke-dasharray={node.strokeDash}></polygon>
                        <template if:true={node.strategyMark}>
                            <template if:true={node.strategyMark.isL1Edge}>
                                <polygon class="bcm-strategy-stripe" points={node.strategyMark.polygonPoints}></polygon>
                            </template>
                            <template if:true={node.strategyMark.isRect}>
                                <rect class="bcm-strategy-stripe"
                                      x={node.strategyMark.x}
                                      y={node.strategyMark.y}
                                      width={node.strategyMark.width}
                                      height={node.strategyMark.height}>
                                </rect>
                            </template>
                        </template>
                        <template for:each={node.labelLines} for:item="line">
                            <text
                                key={line.key}
                                x={line.x}
                                y={line.y}
                                text-anchor="middle"
                                dominant-baseline="middle"
                                fill={l1LabelColour}
                                font-size="13"
                                font-weight="bold">
                                {line.text}
                            </text>
                        </template>
                        <template if:true={canEdit}>
                            <text
                                class="bcm-drag-handle"
                                data-bcm-drag-handle="true"
                                data-node-id={node.id}
                                data-node-level="1"
                                x={node.handleX}
                                y={node.handleY}
                                font-size="14"
                                fill={l1LabelColour}
                                onmousedown={handleHandleMouseDown}>
                                ⠿
                            </text>
                        </template>
                    </g>
                </template>
            </g>

            <!-- Drag drop indicator (in zoomed viewport coords) -->
            <template if:true={dropIndicator}>
                <g transform={viewportTransform}>
                    <line
                        class="bcm-drop-indicator"
                        data-bcm-drop-indicator="true"
                        x1={dropIndicator.x1}
                        y1={dropIndicator.y1}
                        x2={dropIndicator.x2}
                        y2={dropIndicator.y2}
                        stroke={focusRingColour}
                        stroke-width="2">
                    </line>
                </g>
            </template>

            <!-- Drag ghost (in zoomed viewport coords) -->
            <template if:true={ghost}>
                <g class="bcm-ghost" data-bcm-ghost="true" transform={ghostTransform}>
                    <template if:true={ghost.isL1}>
                        <polygon points={ghost.points} fill={l1GhostFill} stroke={l1GhostStroke} stroke-width="1"></polygon>
                    </template>
                    <template if:true={ghost.isL2}>
                        <rect x="0" y="0" width={ghost.width} height={ghost.height} rx="6" fill={l2GhostFill} stroke={focusRingColour} stroke-width="1"></rect>
                    </template>
                    <template if:true={ghost.isL3}>
                        <rect x="0" y="0" width={ghost.width} height={ghost.height} rx="3" fill="transparent" stroke={focusRingColour} stroke-width="1"></rect>
                    </template>
                    <text x={ghost.labelX} y={ghost.labelY} font-size="12" fill={ghost.labelFill}>{ghost.label}</text>
                </g>
            </template>

            <!-- Cross-cutting band: pans horizontally with L1 layer; pinned vertically (no panY).
                 Full-width layered chevrons — sortOrder 1 paints last → on top. -->
            <template if:true={showCrossCutting}>
                <g transform={bandTransform}>
                    <template for:each={bandNodes} for:item="node">
                        <g key={node.id}
                           class="bcm-band-node"
                           data-node-id={node.id}
                           data-node-name={node.name}
                           data-node-level="1"
                           onclick={handleBandClick}>
                            <polygon points={node.points} fill={node.fill} stroke={bandStroke} stroke-width="1.2"></polygon>
                            <template if:true={node.strategyMark}>
                                <template if:true={node.strategyMark.isRect}>
                                    <rect class="bcm-strategy-stripe"
                                          x={node.strategyMark.x}
                                          y={node.strategyMark.y}
                                          width={node.strategyMark.width}
                                          height={node.strategyMark.height}>
                                    </rect>
                                </template>
                            </template>
                            <text
                                x={node.labelX}
                                y={node.labelY}
                                dominant-baseline="alphabetic"
                                fill={node.labelColor}
                                font-size="13"
                                font-weight="700"
                                letter-spacing="0.4">
                                {node.label}
                            </text>
                        </g>
                    </template>
                </g>
            </template>
        </svg>
    </div>

    <!-- Panel-only clip wrapper — keeps the off-screen (translateX(100%)) detail panel
         from bleeding outside the LWC, without clipping toolbar overlays. -->
    <div class="bcm-panel-clip">
        <c-bcm_-capability-detail
            capability={detailCapability}
            breadcrumb={detailBreadcrumb}
            is-loading={detailIsLoading}
            error-message={detailErrorMessage}
            can-edit={canEdit}
            onclose={handleDetailClose}
            onsaved={handleDetailSaved}>
        </c-bcm_-capability-detail>
    </div>
    </div>
</template>

<template>
    <!-- Toolbar -->
    <div class="bcm-toolbar slds-grid slds-grid_align-spread slds-p-around_x-small slds-border_bottom">
        <div class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
            <div class="slds-col">
                <lightning-combobox
                    label="Map"
                    placeholder="Select a map…"
                    options={mapOptions}
                    value={selectedMapId}
                    onchange={handleMapChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col">
                <lightning-combobox
                    label="Colour by Tag"
                    placeholder="None"
                    options={tagOptions}
                    value={selectedTagId}
                    onchange={handleTagChange}>
                </lightning-combobox>
            </div>
        </div>
        <div class="slds-grid slds-grid_vertical-align-end slds-gutters_xx-small">
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:add"
                    title="Zoom In"
                    onclick={handleZoomIn}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:dash"
                    title="Zoom Out"
                    onclick={handleZoomOut}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    title="Reset View"
                    onclick={handleResetView}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:expand"
                    title="Fit to Window"
                    onclick={handleFitToWindow}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    icon-name="utility:hide"
                    title="Show Hidden"
                    variant={showHiddenVariant}
                    onclick={handleToggleHidden}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button-icon
                    data-id="cross-cutting-toggle"
                    icon-name="utility:rows"
                    title="Cross-cutting"
                    variant={crossCuttingVariant}
                    onclick={handleToggleCrossCutting}>
                </lightning-button-icon>
            </div>
        </div>
    </div>

    <!-- Error -->
    <template if:true={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_small" role="alert">
            <span>{errorMessage}</span>
        </div>
    </template>

    <!-- Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading…" size="medium"></lightning-spinner>
    </template>

    <!-- SVG Canvas -->
    <div class="bcm-canvas-container">
        <svg
            class="bcm-canvas"
            width={canvasWidth}
            height={canvasHeight}
            tabindex="0"
            onkeydown={handleKeyDown}
            onmousedown={handleSvgMouseDown}
            onmousemove={handleSvgMouseMove}
            onmouseup={handleSvgMouseUp}
            onmouseleave={handleSvgMouseUp}
            onwheel={handleWheel}>

            <!-- L2 layer: full pan + zoom -->
            <g transform={viewportTransform}>
                <!-- L2 Boxes -->
                <template for:each={l2Nodes} for:item="node">
                    <g key={node.id} onclick={handleNodeClick} data-node-id={node.id} data-node-name={node.name} data-node-level="2" data-focused={node.isFocused} class="bcm-node">
                        <rect
                            x={node.x}
                            y={node.y}
                            width={node.width}
                            height={node.height}
                            rx="6"
                            fill={node.fill}
                            stroke={node.strokeColour}
                            stroke-width={node.strokeWidth}
                            stroke-dasharray={node.strokeDash}>
                        </rect>
                        <template for:each={node.labelLines} for:item="line">
                            <text
                                key={line.key}
                                x={line.x}
                                y={line.y}
                                dominant-baseline="middle"
                                fill="#222222"
                                font-size="12"
                                font-weight="bold">
                                {line.text}
                            </text>
                        </template>
                        <!-- L3 bullets -->
                        <template for:each={node.bulletGroups} for:item="group">
                            <g key={group.key} data-l3-group={group.l3Id} style="cursor:pointer">
                                <template if:true={group.focusRect}>
                                    <rect
                                        x={group.focusRect.x}
                                        y={group.focusRect.y}
                                        width={group.focusRect.width}
                                        height={group.focusRect.height}
                                        rx="3"
                                        fill="#E8F4FF"
                                        stroke="#0070D2"
                                        stroke-width="1"
                                        class="bcm-l3-focus-rect">
                                    </rect>
                                </template>
                                <template for:each={group.lines} for:item="line" for:index="lineIdx">
                                    <text
                                        key={line.key}
                                        data-node-id={group.l3Id}
                                        data-node-name={group.l3Name}
                                        data-node-level="3"
                                        data-focused={group.isFocused}
                                        x={line.x}
                                        y={line.y}
                                        dominant-baseline="middle"
                                        fill={line.fill}
                                        font-size="11"
                                        font-weight={line.fontWeight}
                                        font-style={line.fontStyle}>
                                        {line.text}
                                    </text>
                                </template>
                            </g>
                        </template>
                    </g>
                </template>
            </g>

            <!-- L1 layer: pans horizontally only, not vertically — drawn last so always on top -->
            <g transform={l1Transform}>
                <template for:each={l1Nodes} for:item="node">
                    <g key={node.id} onclick={handleNodeClick} data-node-id={node.id} data-node-name={node.name} data-node-level="1" data-focused={node.isFocused} class="bcm-node">
                        <polygon points={node.points} fill={node.fill} stroke={node.strokeColour} stroke-width={node.strokeWidth} stroke-dasharray={node.strokeDash}></polygon>
                        <template for:each={node.labelLines} for:item="line">
                            <text
                                key={line.key}
                                x={line.x}
                                y={line.y}
                                text-anchor="middle"
                                dominant-baseline="middle"
                                fill="#FFFFFF"
                                font-size="13"
                                font-weight="bold">
                                {line.text}
                            </text>
                        </template>
                    </g>
                </template>
            </g>

            <!-- Cross-cutting band: pans horizontally with L1 layer; pinned vertically (no panY).
                 Full-width layered chevrons — sortOrder 1 paints last → on top. -->
            <template if:true={showCrossCutting}>
                <g transform={bandTransform}>
                    <template for:each={bandNodes} for:item="node">
                        <g key={node.id}
                           class="bcm-band-node"
                           data-node-id={node.id}
                           data-node-name={node.name}
                           data-node-level="1"
                           onclick={handleBandClick}>
                            <polygon points={node.points} fill={node.fill} stroke="#0e2342" stroke-width="1.2"></polygon>
                            <text
                                x={node.labelX}
                                y={node.labelY}
                                dominant-baseline="alphabetic"
                                fill="#FFFFFF"
                                font-size="13"
                                font-weight="700"
                                letter-spacing="0.4">
                                {node.label}
                            </text>
                        </g>
                    </template>
                </g>
            </template>
        </svg>

        <!-- Context menu overlay -->
        <template if:true={contextMenuVisible}>
            <c-bcm_-context-menu
                anchor-x={contextMenuX}
                anchor-y={contextMenuY}
                node={contextMenuNode}
                can-edit={canEdit}
                onclose={handleContextMenuClose}
                onviewdetail={handleViewDetail}
                onhide={handleHide}>
            </c-bcm_-context-menu>
        </template>

        <!-- Detail panel overlay -->
        <c-bcm_-capability-detail
            capability={detailCapability}
            breadcrumb={detailBreadcrumb}
            is-loading={detailIsLoading}
            error-message={detailErrorMessage}
            can-edit={canEdit}
            onclose={handleDetailClose}
            onsaved={handleDetailSaved}>
        </c-bcm_-capability-detail>
    </div>
</template>
